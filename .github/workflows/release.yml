name: Build Electron App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: Regne-mac
          - os: windows-latest
            artifact_name: Regne-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build source code
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ad-hoc sign so macOS doesn't show "app is damaged"
      - name: Ad-hoc sign macOS app
        if: matrix.os == 'macos-latest'
        run: |
          codesign --deep --force --sign - "dist/mac-arm64/Regne.app"
          # Re-create the DMG from the signed .app
          hdiutil create -volname "Regne" -srcfolder "dist/mac-arm64/Regne.app" -ov -format UDZO "dist/Regne-resigned.dmg"

      # Upload installer + update manifest to the GitHub Release
      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Regne-resigned.dmg
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
